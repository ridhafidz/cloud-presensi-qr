<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aplikasi Presensi Mahasiswa</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

body{
font-family:Poppins;
background:linear-gradient(135deg,#74b9ff,#a29bfe);
margin:0;
padding:20px;
display:flex;
flex-direction:column;
align-items:center;
}

.container{
max-width:800px;
width:100%;
}

.card{
background:white;
padding:25px;
border-radius:15px;
margin-bottom:15px;
display:none;
}

.card.active{
display:block;
}

button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
}

.btn-primary{background:#0984e3;color:white}
.btn-danger{background:#d63031;color:white}
.btn-success{background:#00b894;color:white}

#reader{
width:300px;
margin:auto;
display:none;
}

#map{
height:300px;
display:none;
margin-top:10px;
}

.bottom-nav{
position:fixed;
bottom:10px;
background:white;
padding:10px;
border-radius:30px;
display:flex;
gap:10px;
}

.nav-item{
padding:10px 20px;
border:none;
background:#ddd;
border-radius:20px;
}

.nav-item.active{
background:#0984e3;
color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="card active" id="tab-presensi">

<h2>Presensi QR</h2>

<input id="nim" placeholder="NIM"><br><br>
<input id="nama" placeholder="Nama"><br><br>

<button class="btn-primary" onclick="toggleCamera()">Buka Kamera</button>

<div id="reader"></div>

<br>

<input id="token" placeholder="Token QR">

<button onclick="submitManualToken()">Kirim</button>

<p id="qr-result"></p>

</div>


<div class="card" id="tab-accel">

<h2>Sensor Accelerometer</h2>

<button class="btn-success" onclick="toggleAccel()">Mulai Rekam</button>

<canvas id="accelChart"></canvas>

<p id="accel-result"></p>

</div>


<div class="card" id="tab-gps">

<h2>GPS Tracker</h2>

<button class="btn-primary" onclick="toggleGPS()">Mulai GPS</button>

<div id="map"></div>

<p id="gps-result"></p>

</div>

</div>


<nav class="bottom-nav">

<button class="nav-item active" onclick="switchTab('presensi',this)">Presensi</button>

<button class="nav-item" onclick="switchTab('accel',this)">Accel</button>

<button class="nav-item" onclick="switchTab('gps',this)">GPS</button>

</nav>



<script>

const API_URL="MASUKKAN_URL_APPS_SCRIPT_KAMU";

let html5QrCode;
let cameraActive=false;

function switchTab(tab,btn){

document.querySelectorAll(".card").forEach(c=>c.classList.remove("active"));
document.querySelector("#tab-"+tab).classList.add("active");

document.querySelectorAll(".nav-item").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");

if(tab==="gps" && map){
setTimeout(()=>map.invalidateSize(),200)
}

}


function toggleCamera(){

const reader=document.getElementById("reader")

if(!cameraActive){

reader.style.display="block"

html5QrCode=new Html5Qrcode("reader")

html5QrCode.start(
{facingMode:"environment"},
{fps:10,qrbox:250},

(decodedText)=>{

document.getElementById("token").value=decodedText

html5QrCode.stop()

reader.style.display="none"

cameraActive=false

submitManualToken()

}

)

cameraActive=true

}

else{

html5QrCode.stop()

reader.style.display="none"

cameraActive=false

}

}


async function submitManualToken(){

const nim=document.getElementById("nim").value
const nama=document.getElementById("nama").value
const token=document.getElementById("token").value

if(!nim||!nama||!token){

document.getElementById("qr-result").innerText="Lengkapi data"

return

}

document.getElementById("qr-result").innerText="Mengirim..."

try{

const res=await fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({nim,nama,token})
})

const data=await res.json()

document.getElementById("qr-result").innerText="Presensi berhasil"

}

catch(e){

document.getElementById("qr-result").innerText="Server error"

}

}



let accelRecording=false
let accelData=[]

const ctx=document.getElementById("accelChart")

const chart=new Chart(ctx,{
type:"line",
data:{
labels:[],
datasets:[
{label:"X",data:[]},
{label:"Y",data:[]},
{label:"Z",data:[]}
]
}
})


function handleMotion(e){

const x=e.accelerationIncludingGravity.x
const y=e.accelerationIncludingGravity.y
const z=e.accelerationIncludingGravity.z

accelData.push({x,y,z})

chart.data.labels.push("")

chart.data.datasets[0].data.push(x)
chart.data.datasets[1].data.push(y)
chart.data.datasets[2].data.push(z)

if(chart.data.labels.length>20){

chart.data.labels.shift()

chart.data.datasets.forEach(d=>d.data.shift())

}

chart.update()

}


function toggleAccel(){

if(!accelRecording){

window.addEventListener("devicemotion",handleMotion)

accelRecording=true

document.getElementById("accel-result").innerText="Merekam..."

}

else{

window.removeEventListener("devicemotion",handleMotion)

accelRecording=false

document.getElementById("accel-result").innerText="Rekaman selesai"

}

}



let map
let marker
let gpsActive=false
let watchID

function toggleGPS(){

if(!navigator.geolocation){

alert("GPS tidak didukung")

return

}

if(!gpsActive){

watchID=navigator.geolocation.watchPosition(pos=>{

const lat=pos.coords.latitude
const lng=pos.coords.longitude

document.getElementById("gps-result").innerText=lat+" , "+lng

if(!map){

map=L.map("map").setView([lat,lng],17)

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map)

marker=L.marker([lat,lng]).addTo(map)

document.getElementById("map").style.display="block"

}

else{

marker.setLatLng([lat,lng])

map.setView([lat,lng])

}

})

gpsActive=true

}

else{

navigator.geolocation.clearWatch(watchID)

gpsActive=false

}

}

</script>

  
</body>
</html>
