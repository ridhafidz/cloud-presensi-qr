```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aplikasi Presensi Mahasiswa</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/html5-qrcode@2.3.10/minified/html5-qrcode.min.js"></script>

<style>

body{
font-family:'Poppins',sans-serif;
margin:0;
background:linear-gradient(135deg,#74b9ff,#a29bfe);
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:600px;
}

.card{
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h2{
text-align:center;
margin-top:0;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:2px solid #dfe6e9;
margin-bottom:10px;
}

button{
width:100%;
padding:14px;
border-radius:12px;
border:none;
font-weight:600;
cursor:pointer;
}

.btn-primary{
background:#0984e3;
color:white;
}

.btn-danger{
background:#d63031;
color:white;
}

.status{
margin-top:15px;
padding:10px;
background:#f1f2f6;
border-radius:10px;
text-align:center;
}

#reader{
margin-top:15px;
display:none;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>Presensi QR</h2>

<input id="input-nim-qr" placeholder="NIM">
<input id="input-nama" placeholder="Nama Lengkap">

<button id="btn-camera" class="btn-primary" onclick="toggleCamera()">
📷 Buka Kamera QR
</button>

<div id="reader"></div>

<input id="manual-token" placeholder="Token QR">

<button onclick="submitManualToken()">Kirim</button>

<div class="status" id="qr-result">
Silakan scan QR atau masukkan token
</div>

</div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbxyCH0XLmY4iZrP0R9U2JoNX8W66klvqtwJevp4CNeCOezL-DWVh0tRkofPwiyKFSpC/exec"

const defaultCourseId='cloud-101'
const defaultSessionId='sesi-02'

let scanner=null

function getDeviceId(){

let d=localStorage.getItem('device_id')

if(!d){

d='DEV-'+Math.random().toString(36).substr(2,6).toUpperCase()

localStorage.setItem('device_id',d)

}

return d
}

function toggleCamera(){

const reader=document.getElementById("reader")
const btn=document.getElementById("btn-camera")

if(!scanner){

reader.style.display="block"

scanner=new Html5QrcodeScanner(
"reader",
{
fps:10,
qrbox:250,
rememberLastUsedCamera:true
}
)

scanner.render((decodedText)=>{

document.getElementById("manual-token").value=decodedText

scanner.clear()
scanner=null

reader.style.display="none"

btn.innerText="📷 Buka Kamera QR"
btn.className="btn-primary"

submitManualToken()

})

btn.innerText="Tutup Kamera"
btn.className="btn-danger"

}

else{

scanner.clear()
scanner=null

reader.style.display="none"

btn.innerText="📷 Buka Kamera QR"
btn.className="btn-primary"

}

}

async function sendRequest(path,payload=null){

try{

const options={method:'POST',body:JSON.stringify(payload)}

const res=await fetch(`${API_URL}?path=${path}`,options)

return await res.json()

}catch(e){

return {ok:false,error:e.message}

}

}

async function submitManualToken(){

const nim=document.getElementById('input-nim-qr').value.trim()
const nama=document.getElementById('input-nama').value.trim()
const token=document.getElementById('manual-token').value.trim()

const res=document.getElementById('qr-result')

if(!nim||!nama||!token){

res.innerText="❌ Harap isi NIM Nama Token"

return
}

res.innerText="⏳ Memproses..."

const payload={
user_id:`${nim} - ${nama}`,
device_id:getDeviceId(),
course_id:defaultCourseId,
session_id:defaultSessionId,
qr_token:token,
ts:new Date().toISOString()
}

const response=await sendRequest('presence/checkin',payload)

if(response.ok){

res.innerHTML=`✅ Berhasil<br>ID:${response.data.presence_id}`

}

else{

res.innerText="❌ "+response.error

}

}

</script>

</body>
</html>
```
