<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw8aZp74OIFVsWDKdYUNZ8XpPlz_nm-oGJshX7_xNZk12AuiccI3TjFMPqa9S8d0Tti5w/exec";

let qrcode = null;
let countdownTimer = null;

// ==========================
// 🔥 HELPER REQUEST
// ==========================
async function sendRequest(path, payload = null) {
  try {
    const isPost = payload !== null;

    const options = {
      method: isPost ? "POST" : "GET",
      headers: {
        "Content-Type": "application/json"
      }
    };

    if (isPost) {
      options.body = JSON.stringify(payload);
    }

    const response = await fetch(`${API_URL}?path=${path}`, options);
    return await response.json();

  } catch (error) {
    return { ok: false, error: error.message };
  }
}

// ==========================
// 🔥 GENERATE QR
// ==========================
async function generateQR() {
  const course = document.getElementById('input-course').value.trim();
  const session = document.getElementById('input-session').value.trim();

  if (!course || !session) {
    alert("Course ID dan Session ID wajib diisi!");
    return;
  }

  const btn = document.getElementById('btn-generate');
  btn.disabled = true;
  btn.innerText = "Membuat QR...";

  document.getElementById('status-text').innerText = "⏳ Sedang generate...";
  document.getElementById('placeholder').style.display = "none";

  if (countdownTimer) clearInterval(countdownTimer);

  const payload = {
    course_id: course,
    session_id: session,
    ts: new Date().toISOString()
  };

  const response = await sendRequest("presence/qr/generate", payload);

  btn.disabled = false;
  btn.innerText = "Refresh QR";

  if (!response.ok) {
    document.getElementById('status-text').innerText = "❌ Error: " + response.error;
    return;
  }

  // ==========================
  // ✅ DATA BENAR DARI BACKEND
  // ==========================
  const qrToken = response.data.qr_token;
  const expiresAt = response.data.expires_at;

  // tampilkan info
  document.getElementById('status-text').innerText =
    `✅ Token: ${qrToken}\nExpired: ${new Date(expiresAt).toLocaleTimeString()}`;

  // render QR
  const qrContainer = document.getElementById("qr-container");
  qrContainer.innerHTML = "";

  qrcode = new QRCode(qrContainer, {
    text: qrToken,
    width: 250,
    height: 250
  });

  startCountdown(120);
}

// ==========================
// ⏳ COUNTDOWN
// ==========================
function startCountdown(seconds) {
  const el = document.getElementById("countdown-text");
  el.style.opacity = "1";

  let timeLeft = seconds;

  countdownTimer = setInterval(() => {
    timeLeft--;
    el.innerText = "🔄 Refresh dalam " + timeLeft + " detik";

    if (timeLeft <= 0) {
      clearInterval(countdownTimer);
      generateQR();
    }
  }, 1000);
}
</script>
