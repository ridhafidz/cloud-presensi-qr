<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Presensi Terpadu</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
    .container { background: rgba(255, 255, 255, 0.95); padding: 40px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
    h1 { margin-top: 0; color: #2c3e50; font-size: 28px; font-weight: 700; margin-bottom: 5px; }
    p { color: #636e72; font-size: 15px; margin-bottom: 30px; }
    
    .btn-wrapper { display: flex; flex-direction: column; gap: 15px; }
    .role-btn { display: flex; align-items: center; justify-content: center; gap: 15px; background: white; border: 2px solid #dfe6e9; border-radius: 16px; padding: 20px; cursor: pointer; transition: all 0.3s ease; text-decoration: none; color: #2d3436; flex: 1; }
    .role-btn:hover { border-color: #6c5ce7; box-shadow: 0 8px 25px rgba(108, 92, 231, 0.15); transform: translateY(-3px); }
    .role-icon { font-size: 45px; }
    .role-text { text-align: left; }
    .role-text strong { display: block; font-size: 18px; color: #2d3436; }
    .role-text span { font-size: 12px; color: #a4b0be; }

    /* RESPONSIVE DESKTOP/TABLET */
    @media (min-width: 600px) {
      .btn-wrapper { flex-direction: row; }
      .container { padding: 50px 40px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Selamat Datang</h1>
    <p>Silakan pilih portal akses Anda untuk melanjutkan ke sistem presensi terpadu.</p>

    <div class="btn-wrapper">
      <a href="dosen.html" class="role-btn">
        <div class="role-icon">👨‍🏫</div>
        <div class="role-text">
          <strong>Portal Dosen</strong>
          <span>Dashboard & Telemetri</span>
        </div>
      </a>
      <a href="mahasiswa.html" class="role-btn">
        <div class="role-icon">👨‍🎓</div>
        <div class="role-text">
          <strong>Mahasiswa</strong>
          <span>Presensi & Sensor</span>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
